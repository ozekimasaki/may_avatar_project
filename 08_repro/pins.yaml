# Reproduction pins. Update only at freeze / release gates.
project: mei_avatar
spec_version: v003

images:
  character_sheet: 00_reference/character_sheet.png
  master_candidate: 01_art/candidates/avatar_base.png
  master: 01_art/master/mei_master_v001.png
  face_atlas: 01_art/face_atlas/mei_face_atlas_v001.png

prompts:
  master: master_v001
  master_repair: master_repair_v001
  face_atlas: face_atlas_v001

kie:
  primary_model: gpt-image-2-image-to-image
  grok_edit: grok-imagine-image-2-0/image-edit
  grok_segment: grok-imagine-image-2-0/segment-map
  grok_t2i: grok-imagine-image-2-0/text-to-image
