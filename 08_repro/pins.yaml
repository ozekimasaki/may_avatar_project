  master_aspect_ratio: "2:3"
  master_resolution: "1K"

see_through:
  repo: https://github.com/shitagaki-lab/see-through
  commit_file: 02_seethrough/see_through_commit.txt
  python: "3.12"
  pytorch: "2.8.0+cu128"
  torchvision: "0.23.0"
  torchaudio: "2.8.0"
  session_name: mei-st-run

inochi:
  creator_version: "0.8.6"
  creator_zip: https://github.com/Inochi2D/inochi-creator/releases/download/v0.8.6/inochi-creator-win32.zip
  note: win32 means Win32 API, not 32-bit. Requires x86_64 + VC++ 2022 x64.
  local_path: tools/inochi-creator/inochi-creator.exe
  nightly_forbidden: true

skills:
  kie-imagegen: .cursor/skills/kie-imagegen
  mei-master: .cursor/skills/mei-master
  mei-gate-review: .cursor/skills/mei-gate-review

budget:
  v0.1_cap: 6
